# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
    - ruby@3.4.2
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - brakeman@5.4.0
    - checkov@3.3.17
    - dotenv-linter@4.0.0
    - git-diff-check
    - hadolint@2.14.0
    - markdownlint@0.49.1
    - osv-scanner@2.4.0
    - oxipng@10.1.1
    - prettier@3.9.7
    - rubocop@1.39.0
    - rufo@0.13.0
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - svgo@4.1.0
    - taplo@0.10.0
    - terrascan@1.19.9
    - trivy@0.71.2
    - trufflehog@3.95.6
    - yamllint@1.38.0
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
